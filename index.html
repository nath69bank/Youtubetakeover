<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Takeover · Wirral AI</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --text: #1b1f24; --muted: #5b6470;
    --border: #e2e5ea; --accent: #2457d6; --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #181c21; --text: #e6e9ed; --muted: #9aa3ad;
      --border: #2a3038; --accent: #7aa2ff; --code: #1e232a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .layout { display: flex; min-height: 100vh; }
  nav { width: 280px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav h1 { font-size: 17px; margin: 0 0 4px; }
  nav .sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  nav a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 14px; }
  nav a:hover { background: var(--border); }
  nav a.active { background: var(--accent); color: #fff; }
  main { flex: 1; min-width: 0; padding: 32px 40px 80px; }
  article { max-width: 900px; margin: 0 auto; }
  article a { color: var(--accent); }
  article h1 { font-size: 30px; line-height: 1.25; }
  article h2 { margin-top: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  article table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1em 0; font-size: 14px; }
  article th, article td { border: 1px solid var(--border); padding: 6px 10px; vertical-align: top; }
  article th { background: var(--panel); text-align: left; }
  article code { background: var(--code); padding: 2px 5px; border-radius: 4px; font-size: .9em; }
  article pre { background: var(--code); padding: 14px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
  article pre code { padding: 0; background: none; }
  article blockquote { margin: 1em 0; padding: .2em 1em; border-left: 4px solid var(--accent); background: var(--panel); }
  article img { max-width: 100%; }
  .menu-btn { display: none; }
  @media (max-width: 860px) {
    .layout { display: block; }
    nav { position: static; width: auto; height: auto; display: none; border-right: 0; border-bottom: 1px solid var(--border); }
    nav.open { display: block; }
    .menu-btn { display: block; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border);
      background: var(--panel); color: var(--text); font: inherit; text-align: left; }
    main { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn">☰ Menu</button>
<div class="layout">
  <nav id="nav">
    <h1>YouTube Takeover</h1>
    <div class="sub">Wirral AI lead-magnet channel</div>
  </nav>
  <main><article id="content">Loading…</article></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const SECTIONS = [
    ["Start", [["README.md", "Overview & first 7 days"], ["prompts/README.md", "The 10 prompts"]]],
    ["Strategy", [
      ["strategy/01-90-day-plan.md", "1. 90-day plan"],
      ["strategy/02-niche-and-positioning.md", "2. Niche & positioning"],
      ["strategy/03-competitor-research.md", "3. Competitor research"],
      ["strategy/06-algorithm-playbook.md", "6. Algorithm playbook"],
      ["strategy/09-monetisation-and-leads.md", "9. Monetisation & leads"]]],
    ["Content", [
      ["content/04-video-ideas.md", "4. 20 video ideas"],
      ["content/scripts/001-ai-for-small-business.md", "5. Script 001"],
      ["content/07-shorts-plan.md", "7. Shorts plan"]]],
    ["Operations", [
      ["operations/08-production-workflow.md", "8. Production workflow"],
      ["operations/10-review-system.md", "10. Review system"]]],
    ["Funnel", [
      ["funnel/lead-magnets.md", "Lead magnets"],
      ["funnel/description-template.md", "Description template"],
      ["funnel/cta-scripts.md", "CTA scripts"]]],
    ["Templates", [
      ["templates/video-brief.md", "Video brief"],
      ["templates/weekly-review.md", "Weekly review"],
      ["templates/monthly-review.md", "Monthly review"],
      ["templates/tracker.csv", "Tracker (CSV download)"]]],
  ];

  const nav = document.getElementById("nav");
  const content = document.getElementById("content");
  document.getElementById("menuBtn").onclick = () => nav.classList.toggle("open");

  for (const [title, items] of SECTIONS) {
    const h = document.createElement("h2");
    h.textContent = title;
    nav.appendChild(h);
    for (const [path, label] of items) {
      const a = document.createElement("a");
      a.textContent = label;
      a.href = path.endsWith(".md") ? "#/" + path : path;
      if (!path.endsWith(".md")) a.setAttribute("download", "");
      a.dataset.path = path;
      nav.appendChild(a);
    }
  }

  // GitHub-style heading slugs so in-doc anchors (file.md#section) keep working.
  function slugify(text) {
    return text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  }

  function resolve(base, rel) {
    const parts = base.split("/").slice(0, -1);
    for (const seg of rel.split("/")) {
      if (seg === "..") parts.pop();
      else if (seg !== ".") parts.push(seg);
    }
    return parts.join("/");
  }

  async function load() {
    const [path, anchor] = (location.hash.replace(/^#\//, "") || "README.md").split("#");
    nav.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.path === path));
    nav.classList.remove("open");
    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error(res.status);
      content.innerHTML = DOMPurify.sanitize(marked.parse(await res.text()));
    } catch (e) {
      content.innerHTML = "<h1>Not found</h1><p>Couldn't load " + path.replace(/</g, "&lt;") + ".</p>";
      return;
    }
    const seen = {};
    content.querySelectorAll("h1,h2,h3,h4").forEach(h => {
      let id = slugify(h.textContent);
      if (seen[id] !== undefined) id += "-" + (++seen[id]); else seen[id] = 0;
      h.id = id;
    });
    content.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (/^(https?:|mailto:)/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.startsWith("#")) { a.href = "#/" + path + href; return; }
      const [file, hash] = href.split("#");
      let target = resolve(path, file);
      if (target.endsWith("/") || target === "" || !/\.[a-z]+$/i.test(target)) {
        target = target.replace(/\/?$/, "/") + "README.md";
        if (target === "content/scripts/README.md") target = "content/scripts/001-ai-for-small-business.md";
      }
      if (target.endsWith(".md")) a.href = "#/" + target + (hash ? "#" + hash : "");
      else { a.href = target; a.setAttribute("download", ""); }
    });
    if (anchor) document.getElementById(anchor)?.scrollIntoView();
    else window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", load);
  load();
</script>
</body>
</html>
